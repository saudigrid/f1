[build]
  command = "npm run build"
  # ⚠️ لازم صراحة. بلا هذا السطر يحسب Next.js Runtime v5 مجلد النشر
  # مساوياً لمجلد الأساس (كلاهما الجذر) ويرفض البناء بخطأ:
  # "Your publish directory cannot be the same as the base directory".
  # القيمة نفسها لا تُستخدَم حرفياً — الملحق يعيد توجيه الناتج فعلياً إلى
  # .netlify/، لكن وجود قيمة مختلفة عن الأساس يكفي لتفادي الحسبة الخاطئة.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ⚠️ لا استضافة هنا لـ /api/cron/ingest — نتليفاي ليس فيرسل ولا يعرف
# vercel.json. الجدولة تنتقل إلى خدمة كرون خارجية (راجع README) تستدعي
# نفس الرابط بترويسة Authorization نفسها؛ المسار نفسه لا يتغيّر ولا يهتمّ
# من يناديه.
